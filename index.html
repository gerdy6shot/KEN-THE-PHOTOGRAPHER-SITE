<!DOCTYPE html>
<html lang="en" class="bg-[#0b0b0b] text-[#d4d4d4] antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KENNETH HARRIS</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Editorial Serif & Clean Modern Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.05em;
    }
    h1, h2, h3, .art-serif {
      font-family: 'Cormorant Garamond', serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-[#222222] selection:text-[#ffffff]">

  <!-- GALLERY HEADER (Clean, Uncluttered, Minimalist) -->
  <header class="py-12 px-8 md:px-20 border-b border-[#181818] flex justify-between items-baseline">
    <div>
      <h1 class="art-serif text-3xl md:text-5xl text-[#f5f5f5] font-light tracking-wide uppercase">
        Kenneth Harris
      </h1>
      <p class="text-[11px] tracking-[0.35em] text-[#777777] uppercase mt-2 font-light">
        Selected Works &bull; 1970&ndash;2025
      </p>
    </div>

    <!-- Minimalist Secondary Nav -->
    <div class="text-xs tracking-[0.25em] text-[#666666] uppercase font-light hidden md:block">
      Archival Exhibition
    </div>
  </header>

  <!-- ART WORLD EPIGRAPH / CURATORIAL INTENT -->
  <section class="py-24 px-8 max-w-3xl mx-auto text-center">
    <blockquote class="art-serif text-2xl md:text-4xl italic text-[#e0e0e0] font-light leading-relaxed">
      &ldquo;A photograph stops time. It stops death. As long as these files exist, we exist.&rdquo;
    </blockquote>
    <p class="mt-8 text-[11px] tracking-[0.3em] uppercase text-[#666666] font-light">
      Kenneth Harris
    </p>
  </section>

  <!-- EXHIBITION GALLERY GRID -->
  <main class="max-w-7xl mx-auto px-6 md:px-16 pb-24 flex-grow w-full">
    <div id="vault-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-16 md:gap-20">
      <!-- Art assets loaded dynamically from app.js -->
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="border-t border-[#161616] py-12 px-8 text-center text-[10px] tracking-[0.3em] text-[#444444] uppercase font-light">
    Kenneth Harris Estate &bull; Fine Art Archive
  </footer>

  <!-- Supabase CDN & JS App Script -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
